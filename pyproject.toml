[project]
name = "movieintel"
version = "0.1.0"
description = "LLM-integrated movie intelligence system (Task 1: data access)."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "pydantic>=2.7",
]

[project.scripts]
movieintel-demo = "movieintel.data_access.demo:main"
movieintel-eval-demo = "movieintel.eval.demo:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "moto>=5.2.3",
    "aws-cdk-lib>=2.243,<3",
    "constructs>=10,<11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movieintel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "infra"]
mypy_path = ["src", "infra"]
plugins = ["pydantic.mypy"]
# cdk synth writes copies of the handler assets under infra/cdk.out/; those are
# generated artifacts (and gitignored), so keep them out of type-checking.
exclude = ['infra/cdk\.out/']

# boto3/botocore ship no type stubs or py.typed marker; ignore missing imports for
# them only (used in enrichment tests) rather than relaxing strictness globally.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "infra"]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real AWS/Bedrock; skipped by default (REQ-X-3.5)"]
