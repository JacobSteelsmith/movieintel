<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MovieIntel</title>
    <link rel="stylesheet" href="styles.css" />
    <!--
      Baseline accessibility features present in this page:
        - the query input is a real <textarea> with an associated <label for>;
        - submission uses a real <button type="submit"> inside a <form>, so it is
          keyboard-operable (Enter/Space) without extra scripting;
        - a single aria-live="polite" role="status" region announces staged
          progress, results, and errors to assistive technology.
      These are baseline affordances only. Full WCAG conformance is NOT claimed
      from the code alone; it requires manual assistive-technology testing and
      expert review.
    -->
  </head>
  <body>
    <main class="layout">
      <header class="header">
        <h1>MovieIntel</h1>
        <p class="subtitle">Ask about movies, preferences, or comparisons.</p>
      </header>

      <form id="query-form" class="query-form" autocomplete="off">
        <label for="query-input">Your question</label>
        <textarea
          id="query-input"
          name="query"
          rows="4"
          placeholder="e.g. Recommend some uplifting action movies"
        ></textarea>
        <button id="submit-button" type="submit">Ask</button>
      </form>

      <!--
        Single aria-live region reused for staged progress, results and errors
        so the UI never leaves the user stuck on a stale "loading" state.
      -->
      <section
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      ></section>

      <!--
        Persistent help panel. Populated by app.js from the single shared
        HELP_EXAMPLES const (same source the contextual help renders from).
        Labelled by its heading (aria-labelledby) and holds real
        <button type="button"> examples that are keyboard-operable and
        announced to assistive technology. Clicking an example fills the
        textarea and focuses it; it never auto-submits. Baseline affordances
        only - full WCAG conformance requires manual AT testing and expert review.
      -->
      <section
        id="help-panel"
        class="help-panel"
        aria-labelledby="help-heading"
      ></section>
    </main>

    <!-- config.js MUST load before app.js so window.API_BASE_URL is defined. -->
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
